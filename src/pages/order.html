<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Отзывы</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="../index.html">Главная</a>
        <a href="../index.html#table">Сравнение с 13 pro</a>
        <a href="./notes.html">Отзывы</a>
        <a href="./order.html">Заказать</a>
      </nav>
    </header>
    <main>
      <h1>Заказать iPhone 13 Pro Max</h1>
      <form
        action="https://webhook.site/e3c75e54-e5e0-4953-8f09-f36e28de2bc7"
        method="post"
      >
        <label for="nameFieldfForm">Имя &nbsp;</label>
        <input type="text" id="nameFieldfForm" name="name" value="" required />
        <br /><br />
        <label for="surnameFieldfForm">Фамилия &nbsp;</label>
        <input
          type="text"
          id="surnameFieldfForm"
          name="surname"
          value=""
          required
        />
        <br /><br />
        <label for="telFieldfForm">телефон &nbsp;</label>
        <select name="country" id="countryFieldfForm" required>
          <option value="rus" selected>+7</option>
          <option value="by">+375</option>
          <option value="ua">+380</option>
        </select>
        <input type="text" id="telFieldfForm" name="tel" value="" required />
        <br /><br />
        <label for="emailFieldForm">Email &nbsp;</label>
        <input
          type="email"
          id="emailFieldForm"
          name="email"
          value=""
          required
        />
        <br /><br />
        <label for="memoryFieldForm">Объем памяти &nbsp;</label>
        <select name="memory" id="memoryFieldForm" value="">
          <option value="64" selected>64</option>
          <option value="256">256</option>
          <option value="512">512</option></select
        ><br /><br />
        <!-- <label>Способ доставки:</label><br />
        <input type="radio" id="trackerFieldForm" name="send" value="tracker" />
        <label for="trackerFieldForm">Курьером:</label><br />
        <input type="radio" id="ourselfFieldForm" name="send" value="ourself" />
        <label for="ourselfFieldForm">Самовывоз:</label> -->

        <fieldset>
          <legend>Способ доставки:</legend>
          <input
            type="radio"
            id="trackerFieldForm"
            name="send"
            value="tracker"
            required
          />
          <label for="trackerFieldForm">Курьером:</label><br />
          <input
            type="radio"
            id="ourselfFieldForm"
            name="send"
            value="ourself"
            required
          />
          <label for="ourselfFieldForm">Самовывоз:</label>
        </fieldset>
        <br />
        <fieldset>
          <legend>Добавить к заказу:</legend>
          <input
            type="checkbox"
            id="optionsCasingForm"
            name="options[]"
            value="casing"
          />
          <label for="optionsCasingForm">Прозрачный чехол</label><br />
          <input
            type="checkbox"
            id="optionsСhargerForm"
            name="options[]"
            value="charger"
          />
          <label for="optionsСhargerForm"
            >Беспроводное зарядное устройство MagSafe</label
          ><br />
          <input
            type="checkbox"
            id="optionsEarbudForm"
            name="options[]"
            value="earbud"
          />
          <label for="optionsСhargerForm">Наушники AirPods</label><br />
        </fieldset>
        <br />
        <label for="commentFieldForm">Комментарий к заказу:</label><br />
        <textarea
          name="comment"
          id="commentFieldForm"
          cols="30"
          rows="8"
        ></textarea
        ><br /><br />
        <input
          type="checkbox"
          id="agreeFieldForm"
          name="agree"
          value="ok"
          required
        />
        <label for="agreeFieldForm"
          >Принимаю <a href="https://aple.com">условия сайта</a></label
        >
        <br /><br />
        <button type="submit">Заказать</button>
      </form>
    </main>
    <footer>
      <br /><br />
      <hr />
      <p>&copy; Все права защищены</p>
    </footer>
  </body>
</html>
